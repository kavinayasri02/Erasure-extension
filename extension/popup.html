<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 480px;
      background: #0d0d1a;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 20% 20%, rgba(139,92,246,0.15) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 80%, rgba(236,72,153,0.12) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 50%, rgba(59,130,246,0.08) 0%, transparent 60%);
      animation: bgPulse 6s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes bgPulse {
      0% { transform: scale(1) rotate(0deg); opacity: 0.7; }
      100% { transform: scale(1.1) rotate(3deg); opacity: 1; }
    }

    .container { position: relative; z-index: 1; }

    /* Header */
    .header {
      padding: 20px 18px 16px;
      background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(236,72,153,0.15));
      border-bottom: 1px solid rgba(139,92,246,0.3);
      position: relative;
      overflow: hidden;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #8b5cf6, #ec4899, transparent);
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 15px rgba(139,92,246,0.5);
      animation: logoPulse 3s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(139,92,246,0.5); }
      50% { box-shadow: 0 0 25px rgba(236,72,153,0.7); }
    }

    .header h1 {
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.3px;
    }

    .header p {
      font-size: 11px;
      color: rgba(148,163,184,0.8);
      margin-left: 42px;
    }

    /* Status dot */
    .status-dot {
      width: 7px; height: 7px;
      background: #10b981;
      border-radius: 50%;
      margin-left: auto;
      box-shadow: 0 0 8px #10b981;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* Login section */
    #login-section { padding: 24px 18px; }

    .login-title {
      font-size: 13px;
      color: rgba(148,163,184,0.9);
      margin-bottom: 16px;
      text-align: center;
    }

    .input-group {
      position: relative;
      margin-bottom: 12px;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      opacity: 0.5;
    }

    input {
      width: 100%;
      padding: 11px 12px 11px 36px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 13px;
      font-family: 'Inter', system-ui, sans-serif;
      transition: all 0.3s;
      outline: none;
    }

    input:focus {
      border-color: rgba(139,92,246,0.6);
      background: rgba(139,92,246,0.08);
      box-shadow: 0 0 0 3px rgba(139,92,246,0.1);
    }

    input::placeholder { color: rgba(148,163,184,0.4); }

    #login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Inter', system-ui, sans-serif;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 4px;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
    }

    #login-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    #login-btn:hover::before { left: 100%; }
    #login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(139,92,246,0.4); }
    #login-btn:active { transform: translateY(0); }
    #login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    /* Logged in bar */
    .logged-in-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background: rgba(139,92,246,0.08);
      border-bottom: 1px solid rgba(139,92,246,0.15);
    }

    .user-info { display: flex; align-items: center; gap: 8px; }

    .user-avatar {
      width: 24px; height: 24px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: white;
    }

    #user-email-label {
      font-size: 11px;
      color: rgba(148,163,184,0.8);
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #signout-btn {
      font-size: 11px;
      color: rgba(236,72,153,0.8);
      cursor: pointer;
      background: none;
      border: 1px solid rgba(236,72,153,0.3);
      border-radius: 6px;
      padding: 4px 10px;
      font-family: 'Inter', system-ui, sans-serif;
      transition: all 0.2s;
    }

    #signout-btn:hover {
      background: rgba(236,72,153,0.1);
      border-color: rgba(236,72,153,0.6);
      color: #f472b6;
    }

    /* Sessions */
    .sessions-header {
      padding: 14px 18px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sessions-title {
      font-size: 12px;
      font-weight: 600;
      color: rgba(148,163,184,0.7);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .session-count {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .sessions-list { padding: 0 18px 18px; }

    .session-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(139,92,246,0.15);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .session-card:hover {
      border-color: rgba(139,92,246,0.4);
      background: rgba(139,92,246,0.08);
      transform: translateX(2px);
    }

    .session-info h3 {
      font-size: 13px;
      font-weight: 600;
      color: #c4b5fd;
      margin-bottom: 3px;
    }

    .session-info p {
      font-size: 11px;
      color: rgba(148,163,184,0.6);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(16,185,129,0.15);
      color: #34d399;
      border: 1px solid rgba(16,185,129,0.2);
      margin-top: 4px;
    }

    .badge::before {
      content: '';
      width: 5px; height: 5px;
      background: #10b981;
      border-radius: 50%;
      animation: blink 2s infinite;
    }

    .logout-btn {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #f87171;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'Inter', system-ui, sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .logout-btn:hover {
      background: rgba(239,68,68,0.2);
      border-color: rgba(239,68,68,0.6);
      color: #fca5a5;
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(239,68,68,0.2);
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 36px 16px;
      color: rgba(148,163,184,0.5);
    }

    .empty-icon {
      font-size: 36px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .empty p { font-size: 13px; line-height: 1.6; }

    /* Footer */
    .footer {
      padding: 10px 18px;
      border-top: 1px solid rgba(139,92,246,0.1);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(139,92,246,0.05);
    }

    .footer-dot {
      width: 6px; height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: blink 2s infinite;
    }

    .footer span {
      font-size: 11px;
      color: rgba(148,163,184,0.5);
    }

    /* Loading spinner */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(139,92,246,0.3);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div class="logo">🛡️</div>
        <h1>Erasure</h1>
        <div class="status-dot" id="status-dot" style="display:none"></div>
      </div>
      <p>Session security for shared lab computers</p>
    </div>

    <!-- Login Section -->
    <div id="login-section">
      <p class="login-title" style="margin-top:20px">Enter your college email to begin</p>

      <div class="input-group">
        <span class="input-icon">✉️</span>
        <input type="email" id="email-input" placeholder="yourname@college.edu" />
      </div>

      <div class="input-group">
        <span class="input-icon">👤</span>
        <input type="text" id="name-input" placeholder="Your Name" />
      </div>

      <button id="login-btn">🔒 Start Protecting Sessions</button>
    </div>

    <!-- Sessions Section -->
    <div id="sessions-section" style="display:none">

      <div class="logged-in-bar">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">K</div>
          <span id="user-email-label">your@email.com</span>
        </div>
        <button id="signout-btn">Sign out</button>
      </div>

      <div class="sessions-header">
        <span class="sessions-title">Active Sessions</span>
        <span class="session-count" id="session-count">0</span>
      </div>

      <div class="sessions-list" id="sessions-list">
        <div class="empty">
          <div class="empty-icon">🔍</div>
          <p>Loading sessions...</p>
        </div>
      </div>

      <div class="footer">
        <div class="footer-dot"></div>
        <span>Monitoring active — sessions protected</span>
      </div>

    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
